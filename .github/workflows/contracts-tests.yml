name: Contract Tests

on:
  push:
    branches: [main, dev, stg]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-tests.yml'

  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-tests.yml'

  workflow_dispatch:

concurrency:
  group: contracts-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: contracts/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./contracts
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: ./contracts
        run: pnpm test
