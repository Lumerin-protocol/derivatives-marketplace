name: Update Derivatives Oracle Graph

on:
  push:
    branches:
      - dev
      - stg
      - main

    paths:
      - "indexer/**"
      - ".github/workflows/update-derivatives-oracle.yml"

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (dev=DEV, stg=STG, main=LMN/PROD)"
        required: true
        type: choice
        options:
          - dev
          - stg
          - main

concurrency:
  group: ci-derivatives-oracle-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  id-token: write # Required for OIDC
  contents: write # Required for creating git tags

env:
  SERVICE_NAME: derivatives-contract-oracle

jobs:
  # First job to determine environment and version (runs without environment protection)
  setup:
    name: 🔧 Setup
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.gen_tag.outputs.environment }}
      is_cicd_branch: ${{ steps.gen_tag.outputs.is_cicd_branch }}
      version: ${{ steps.gen_tag.outputs.version }}
      tag: ${{ steps.gen_tag.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate version tag
        id: gen_tag
        uses: ./.github/actions/gen-tag
        with:
          component: indexer
          major_version: "3"
          environment_override: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || '' }}

  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.is_cicd_branch != 'true'
    environment: ${{ needs.setup.outputs.environment }}
    outputs:
      version: ${{ needs.setup.outputs.version }}
      tag: ${{ needs.setup.outputs.tag }}
      environment: ${{ needs.setup.outputs.environment }}
      subgraph_name: ${{ steps.env.outputs.subgraph_name }}
      graph_userid: ${{ steps.env.outputs.graph_userid }}
      aws_region: ${{ steps.env.outputs.aws_region }}
      is_cicd_branch: ${{ needs.setup.outputs.is_cicd_branch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: indexer/pnpm-lock.yaml

      - name: Set environment outputs
        id: env
        run: |
          ENV="${{ needs.setup.outputs.environment }}"

          # Map to The Graph Studio subgraph names
          # All deployments now go to The Graph Network (Studio)
          case $ENV in
            dev)
              echo "aws_region=us-east-1" >> $GITHUB_OUTPUT
              echo "subgraph_name=lumerin-dev-derivatives" >> $GITHUB_OUTPUT
              ;;
            stg)
              echo "aws_region=us-east-1" >> $GITHUB_OUTPUT
              echo "subgraph_name=lumerin-stg-derivatives" >> $GITHUB_OUTPUT
              ;;
            main)
              echo "aws_region=us-east-1" >> $GITHUB_OUTPUT
              echo "subgraph_name=lumerin-lmn-derivatives" >> $GITHUB_OUTPUT
              ;;
          esac

          # Set Graph user ID for this environment's account
          GRAPH_USERID="${{ needs.setup.outputs.environment == 'dev' && vars.DEV_GRAPH_USERID || needs.setup.outputs.environment == 'stg' && vars.STG_GRAPH_USERID || vars.LMN_GRAPH_USERID }}"
          echo "graph_userid=$GRAPH_USERID" >> $GITHUB_OUTPUT
          echo "🎯 Deploying to The Graph Studio: subgraph=${subgraph_name}, userid=${GRAPH_USERID}"

      - name: Install dependencies
        working-directory: ./indexer
        run: |
          echo "📦 Installing dependencies..."
          pnpm install --frozen-lockfile

      - name: Build contracts and generate ABIs
        working-directory: ./contracts
        run: |
          echo "🔨 Compiling smart contracts..."
          pnpm install --frozen-lockfile
          pnpm hardhat compile
          echo "✅ Contracts compiled and ABIs generated"

      - name: Prepare subgraph configuration
        working-directory: ./indexer
        env:
          COLLATERAL_TOKEN_ADDRESS: ${{ vars.COLLATERAL_TOKEN_ADDRESS }}
          LIQUIDATION_FEE: ${{ vars.LIQUIDATION_FEE }}
          MAINTENANCE_MARGIN_PERCENT: ${{ vars.MAINTENANCE_MARGIN_PERCENT }}
          MARGIN_PERCENT: ${{ vars.MARGIN_PERCENT }}
          MINIMUM_PRICE_INCREMENT: ${{ vars.MINIMUM_PRICE_INCREMENT }}
          NETWORK: ${{ vars.NETWORK }}
          ORDER_FEE: ${{ vars.ORDER_FEE }}
          PERPS_ADDRESS: ${{ vars.PERPS_ADDRESS }}
          PERPS_START_BLOCK: ${{ vars.PERPS_START_BLOCK }}
          PRICE_ORACLE_ADDRESS: ${{ vars.PRICE_ORACLE_ADDRESS }}
          ETH_NODE_ADDRESS: ${{ secrets.ETH_NODE_ADDRESS }}

        run: |
          echo "⚙️ Preparing subgraph for ${{ needs.setup.outputs.environment }}..."
          echo "   Collateral Token Address: ${COLLATERAL_TOKEN_ADDRESS}"
          echo "   Liquidation Fee: ${LIQUIDATION_FEE}"
          echo "   Maintenance Margin Percent: ${MAINTENANCE_MARGIN_PERCENT}"
          echo "   Margin Percent: ${MARGIN_PERCENT}"
          echo "   Minimum Price Increment: ${MINIMUM_PRICE_INCREMENT}"
          echo "   Network: ${NETWORK}"
          echo "   Order Fee: ${ORDER_FEE}"
          echo "   Perps Address: ${PERPS_ADDRESS}"
          echo "   Perps Start Block: ${PERPS_START_BLOCK}"
          echo "   Price Oracle Address: ${PRICE_ORACLE_ADDRESS}"  
          pnpm prepare:env

          echo "✅ Subgraph configuration ready"
          echo "📄 Generated subgraph.yaml:"
          cat subgraph.yaml

      - name: Generate code
        working-directory: ./indexer
        run: |
          echo "🔨 Generating AssemblyScript types..."
          npx graph codegen
          echo "✅ Code generation complete"

      - name: Build subgraph
        working-directory: ./indexer
        run: |
          echo "🔨 Building subgraph..."
          pnpm build
          echo "✅ Build complete"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: subgraph-build
          path: |
            indexer/build/
            indexer/generated/
            indexer/subgraph.yaml
            contracts/abi/
          retention-days: 1

      - name: Build summary
        run: |
          echo "## 🔨 Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.setup.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Subgraph:** Built and validated successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build verification successful" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.is_cicd_branch != 'true'
    outputs:
      deploy_status: ${{ steps.deploy.outputs.deploy_status }}
      ipfs_hash: ${{ steps.pinata_pin.outputs.ipfs_hash }}

    services:
      # Local IPFS node for graph build (needs Kubo-compatible API)
      # Content is pinned to Pinata after build for permanent availability
      ipfs:
        image: ipfs/kubo:latest
        ports:
          - 5001:5001
        options: >-
          --health-cmd "ipfs id"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: subgraph-build
          path: .

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: indexer/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./indexer
        run: |
          echo "📦 Installing dependencies for deployment..."
          pnpm install --frozen-lockfile

      - name: Build and upload to local IPFS
        id: ipfs_build
        working-directory: ./indexer
        run: |
          echo "📤 Building subgraph and uploading to local IPFS node..."
          echo ""

          set +e
          BUILD_OUTPUT=$(npx graph build --ipfs http://localhost:5001 2>&1)
          BUILD_EXIT=$?
          set -e

          echo "$BUILD_OUTPUT"

          if [ $BUILD_EXIT -ne 0 ]; then
            echo "❌ Build failed"
            exit 1
          fi

          # Extract all IPFS CIDs from build output (sub-files + manifest)
          ALL_CIDS=$(echo "$BUILD_OUTPUT" | grep -oE 'Qm[a-zA-Z0-9]{44}')
          MANIFEST_CID=$(echo "$ALL_CIDS" | tail -1)

          if [ -z "$MANIFEST_CID" ]; then
            echo "❌ Failed to extract IPFS hash from build output"
            exit 1
          fi

          echo ""
          echo "✅ Built and uploaded to local IPFS"
          echo "   Manifest CID: $MANIFEST_CID"
          echo "   All CIDs:"
          echo "$ALL_CIDS" | while read cid; do echo "     - $cid"; done

          echo "manifest_cid=$MANIFEST_CID" >> $GITHUB_OUTPUT
          echo "all_cids<<EOF" >> $GITHUB_OUTPUT
          echo "$ALL_CIDS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Pin all build artifacts to Pinata for permanent IPFS availability.
      # The Graph checks Pinata before the public DHT, so content is found instantly.
      # Each file is: fetched from local Kubo → uploaded to Pinata → verified retrievable.
      - name: Pin to Pinata
        id: pinata_pin
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          MANIFEST_CID="${{ steps.ipfs_build.outputs.manifest_cid }}"
          ALL_CIDS="${{ steps.ipfs_build.outputs.all_cids }}"
          SUBGRAPH="${{ needs.build.outputs.subgraph_name }}"
          VERSION="${{ needs.build.outputs.version }}"
          PINATA_GATEWAY="https://gateway.pinata.cloud/ipfs"

          echo "📌 Pinning subgraph artifacts to Pinata..."
          echo "   Subgraph: $SUBGRAPH"
          echo "   Version:  $VERSION"
          echo ""

          PIN_COUNT=0
          TOTAL_COUNT=$(echo "$ALL_CIDS" | grep -c .)

          for CID in $ALL_CIDS; do
            [ -z "$CID" ] && continue
            PIN_COUNT=$((PIN_COUNT + 1))
            echo "[$PIN_COUNT/$TOTAL_COUNT] Pinning $CID"

            # 1. Fetch content from local Kubo node
            CONTENT_FILE="/tmp/ipfs_$CID"
            HTTP_CODE=$(curl -s -o "$CONTENT_FILE" -w "%{http_code}" \
              -X POST "http://localhost:5001/api/v0/cat?arg=$CID")

            if [ "$HTTP_CODE" != "200" ] || [ ! -s "$CONTENT_FILE" ]; then
              echo "   ❌ FATAL: Could not fetch $CID from local IPFS (HTTP $HTTP_CODE)"
              exit 1
            fi
            FILE_SIZE=$(wc -c < "$CONTENT_FILE" | tr -d ' ')
            echo "   Fetched from local IPFS ($FILE_SIZE bytes)"

            # 2. Upload to Pinata
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              "https://api.pinata.cloud/pinning/pinFileToIPFS" \
              -H "Authorization: Bearer $PINATA_JWT" \
              -F "file=@$CONTENT_FILE;filename=$CID" \
              -F "pinataMetadata={\"name\":\"$SUBGRAPH/$VERSION/$CID\"}")

            PINATA_HTTP=$(echo "$RESPONSE" | tail -1)
            PINATA_BODY=$(echo "$RESPONSE" | sed '$d')

            if [ "$PINATA_HTTP" != "200" ]; then
              echo "   ❌ FATAL: Pinata upload failed (HTTP $PINATA_HTTP)"
              echo "   Response: $PINATA_BODY"
              exit 1
            fi

            PINNED_CID=$(echo "$PINATA_BODY" | jq -r '.IpfsHash // empty')
            PIN_SIZE=$(echo "$PINATA_BODY" | jq -r '.PinSize // empty')

            if [ -z "$PINNED_CID" ]; then
              echo "   ❌ FATAL: No CID in Pinata response"
              echo "   Response: $PINATA_BODY"
              exit 1
            fi
            echo "   Uploaded to Pinata (CID: $PINNED_CID, size: $PIN_SIZE)"

            # 3. Verify content is retrievable from Pinata's gateway
            VERIFY_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "$PINATA_GATEWAY/$PINNED_CID")

            if [ "$VERIFY_CODE" = "200" ]; then
              echo "   Verified on Pinata gateway ✅"
            else
              echo "   ⚠️  Gateway returned HTTP $VERIFY_CODE (may still be propagating)"
              echo "   Content is pinned — The Graph will find it via Pinata's IPFS node"
            fi

            rm -f "$CONTENT_FILE"
            echo ""
          done

          echo "✅ All $TOTAL_COUNT artifacts pinned and verified on Pinata"
          echo "   Manifest CID: $MANIFEST_CID"
          echo "ipfs_hash=$MANIFEST_CID" >> $GITHUB_OUTPUT

      - name: Authenticate with The Graph Studio
        working-directory: ./indexer
        env:
          GRAPH_DEPLOY_KEY: ${{ needs.build.outputs.environment == 'dev' && secrets.DEV_GRAPH_DPKY || needs.build.outputs.environment == 'stg' && secrets.STG_GRAPH_DPKY || secrets.LMN_GRAPH_DPKY }}
        run: |
          echo "🔐 Authenticating with The Graph Studio..."
          echo "   Environment: ${{ needs.build.outputs.environment }}"
          npx graph auth $GRAPH_DEPLOY_KEY
          echo "✅ Authentication successful"

      - name: Deploy subgraph to Studio
        id: deploy
        working-directory: ./indexer
        run: |
          echo "🚀 Deploying subgraph to The Graph Studio..."
          echo "   Environment: ${{ needs.build.outputs.environment }}"
          echo "   Subgraph:    ${{ needs.build.outputs.subgraph_name }}"
          echo "   Version:     ${{ needs.build.outputs.version }}"
          echo "   IPFS Hash:   ${{ steps.pinata_pin.outputs.ipfs_hash }}"
          echo "   Pinned to:   Pinata (permanent)"
          echo ""

          set +e
          npx graph deploy ${{ needs.build.outputs.subgraph_name }} \
            --node https://api.studio.thegraph.com/deploy/ \
            --ipfs-hash ${{ steps.pinata_pin.outputs.ipfs_hash }} \
            --version-label ${{ needs.build.outputs.version }} 2>&1 | tee deploy_output.txt
          DEPLOY_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if grep -q "Version label already exists" deploy_output.txt; then
            echo ""
            echo "✅ Version ${{ needs.build.outputs.version }} already deployed - no update needed"

            echo "## ✅ No Update Needed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Version \`${{ needs.build.outputs.version }}\` is already deployed." >> $GITHUB_STEP_SUMMARY

            echo "deploy_status=no_update" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ $DEPLOY_EXIT_CODE -eq 0 ]; then
            echo ""
            echo "✅ Subgraph deployed to The Graph Studio!"

            echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Environment | ${{ needs.build.outputs.environment }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Version | ${{ needs.build.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Subgraph | ${{ needs.build.outputs.subgraph_name }} |" >> $GITHUB_STEP_SUMMARY
            echo "| IPFS Hash | \`${{ steps.pinata_pin.outputs.ipfs_hash }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| IPFS Pinned | Pinata ✅ |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Studio Links" >> $GITHUB_STEP_SUMMARY
            echo "- [📊 View in Subgraph Studio](https://thegraph.com/studio/subgraph/${{ needs.build.outputs.subgraph_name }}/)" >> $GITHUB_STEP_SUMMARY

            echo "deploy_status=deployed" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "❌ Deployment failed (exit code: $DEPLOY_EXIT_CODE)"

          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**IPFS Hash:** \`${{ steps.pinata_pin.outputs.ipfs_hash }}\` (pinned to Pinata)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Content is permanently pinned to Pinata. Re-run the workflow to retry deployment." >> $GITHUB_STEP_SUMMARY

          exit 1

  verify:
    name: 🔍 Verify
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: needs.build.outputs.is_cicd_branch != 'true'

    steps:
      - name: Verify deployment on The Graph Studio
        run: |
          echo "🔍 Verifying subgraph deployment on The Graph Studio..."
          echo "   Subgraph: ${{ needs.build.outputs.subgraph_name }}"

          # Wait for deployment to propagate
          sleep 15

          # Query The Graph Studio API
          RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"query": "{ _meta { block { number } deployment hasIndexingErrors } }"}' \
            "https://api.studio.thegraph.com/query/${{ needs.build.outputs.graph_userid }}/${{ needs.build.outputs.subgraph_name }}/version/latest")

          echo "Response: $RESPONSE"

          # Check for errors in response
          if echo "$RESPONSE" | jq -e '.errors' > /dev/null 2>&1; then
            echo "⚠️ GraphQL errors in response - subgraph may still be syncing"
            echo "   This is normal for new deployments. Check Studio for status."
            # Don't fail - new deployments take time to sync
            exit 0
          fi

          HAS_ERRORS=$(echo $RESPONSE | jq -r '.data._meta.hasIndexingErrors // false')
          BLOCK_NUMBER=$(echo $RESPONSE | jq -r '.data._meta.block.number // "unknown"')

          echo "   Block number: $BLOCK_NUMBER"
          echo "   Has indexing errors: $HAS_ERRORS"

          if [ "$HAS_ERRORS" == "true" ]; then
            echo "⚠️ Subgraph has indexing errors - check Studio for details"
            exit 1
          fi

          echo "✅ Subgraph deployed and indexing on The Graph Studio"

  cleanup:
    name: 🧹 Cleanup
    runs-on: ubuntu-latest
    needs: [setup, build, verify]
    if: always() && needs.setup.outputs.is_cicd_branch != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        if: needs.verify.result == 'success'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        if: needs.verify.result == 'success'
        run: |
          TAG_NAME="${{ needs.setup.outputs.tag }}"
          echo "🏷️ Creating tag after successful deployment: $TAG_NAME"

          # Check if tag already exists
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "⚠️ Tag $TAG_NAME already exists, skipping tag creation"
          else
            git tag -a "$TAG_NAME" -m "Release ${{ needs.setup.outputs.version }} - Deployed to ${{ needs.setup.outputs.environment }}"
            git push origin "$TAG_NAME"
            echo "✅ Tag $TAG_NAME created and pushed"
          fi

      - name: Deployment summary
        if: needs.verify.result == 'success'
        run: |
          echo "## 🎉 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** Derivatives Marketplace Subgraph" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.setup.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.setup.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Subgraph:** ${{ needs.build.outputs.subgraph_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** The Graph Studio" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Endpoints:**" >> $GITHUB_STEP_SUMMARY
          echo "- Studio: \`https://thegraph.com/studio/subgraph/${{ needs.build.outputs.subgraph_name }}/\`" >> $GITHUB_STEP_SUMMARY
          echo "- Query: \`https://api.studio.thegraph.com/query/${{ needs.build.outputs.graph_userid }}/${{ needs.build.outputs.subgraph_name }}/version/latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Subgraph deployed and indexing on The Graph Studio" >> $GITHUB_STEP_SUMMARY

      - name: Failure summary
        if: needs.verify.result == 'failure'
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** Subgraph (Derivatives Marketplace)" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.setup.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.setup.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Deployment or verification failed. Check logs above for details." >> $GITHUB_STEP_SUMMARY

  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: [setup, build, deploy, verify, cleanup]
    if: always()

    steps:
      - name: Checkout (for composite action)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.setup.outputs.is_cicd_branch }}" == "true" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          elif [ "${{ needs.verify.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          elif [ "${{ needs.verify.result }}" == "failure" ] || [ "${{ needs.deploy.result }}" == "failure" ] || [ "${{ needs.build.result }}" == "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          elif [ "${{ needs.verify.result }}" == "cancelled" ] || [ "${{ needs.deploy.result }}" == "cancelled" ]; then
            echo "status=cancelled" >> $GITHUB_OUTPUT
          else
            echo "status=skipped" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        uses: ./.github/actions/slack-notify
        with:
          status: ${{ steps.status.outputs.status }}
          environment: ${{ needs.setup.outputs.environment }}
          service_name: "Derivatives Oracle"
          version: ${{ needs.setup.outputs.version }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_info: "${{ needs.setup.outputs.is_cicd_branch == 'true' && '*Mode:* CI/CD Test (no build/deploy)' || (needs.deploy.outputs.deploy_status == 'no_update' && format('*Status:* Already deployed (no changes) • <https://api.studio.thegraph.com/query/{1}/{0}/version/latest|Query Playground>', needs.build.outputs.subgraph_name, needs.build.outputs.graph_userid) || format('*Subgraph:* `{0}` • <https://api.studio.thegraph.com/query/{1}/{0}/version/latest|Query Playground>', needs.build.outputs.subgraph_name, needs.build.outputs.graph_userid)) }}"
