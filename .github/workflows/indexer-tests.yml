name: Indexer Tests

on:
  push:
    branches: [main, dev, stg]
    paths:
      - "indexer/**"
      - "contracts/**"
      - "config/*.env"
      - ".github/workflows/indexer-tests.yml"

  pull_request:
    paths:
      - "indexer/**"
      - "contracts/**"
      - "config/*.env"
      - ".github/workflows/indexer-tests.yml"

  workflow_dispatch:

concurrency:
  group: indexer-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  config-scope:
    name: Config scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip the other environment's config
        id: gate
        run: |
          # dev does not deploy when the only change is config/prd.env.
          # main does not deploy when the only change is config/dev.env.
          # Any other file still deploys. A manual run always deploys.
          REF="${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "$REF"
            FILES=$(git diff --name-only "origin/${REF}...HEAD")
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            FILES=$(git diff --name-only "${{ github.event.before }}" HEAD)
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SKIP="config/prd.env"
          [ "$REF" = "main" ] && SKIP="config/dev.env"
          RUN=true
          if [ -n "$FILES" ] && [ -z "$(printf '%s\n' "$FILES" | grep -vx "$SKIP" || true)" ]; then
            RUN=false
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "ref=$REF skip=$SKIP run=$RUN"
          printf '%s\n' "$FILES"

  test:
    name: Indexer Tests
    needs: config-scope
    if: needs.config-scope.result == 'success' && needs.config-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          # Hash both lockfiles — integration tests pull in `derivatives-contracts`
          # (which has its own pnpm-lock.yaml) for the deployment fixture.
          cache-dependency-path: |
            indexer/pnpm-lock.yaml
            contracts/pnpm-lock.yaml

      - name: Install indexer dependencies
        working-directory: ./indexer
        run: pnpm install --frozen-lockfile

      - name: Install contracts dependencies
        working-directory: ./contracts
        run: pnpm install --frozen-lockfile

      # Integration tests deploy the real perps stack via the fixtures in
      # `contracts/tests/fixtures.ts`, which read JSON artifacts from
      # `contracts/artifacts/`. Compile the contracts (and transitive
      # collateral-margin sources) so the fixture can load their bytecode.
      - name: Compile contracts
        working-directory: ./contracts
        run: pnpm compile

      - name: Render subgraph manifest
        working-directory: ./indexer
        run: |
          ENV_FILE=.env.example pnpm prepare:env
          echo "--- subgraph.yaml ---"
          cat subgraph.yaml

      - name: Generate types
        working-directory: ./indexer
        run: pnpm exec graph codegen

      - name: Lint
        working-directory: ./indexer
        run: pnpm lint

      - name: Typecheck
        working-directory: ./indexer
        run: pnpm typecheck

      - name: Run unit tests (matchstick-as)
        working-directory: ./indexer
        run: pnpm test:unit

      - name: Run integration tests (matchstick-ts)
        working-directory: ./indexer
        run: pnpm test:integration
