name: Indexer Tests

on:
  push:
    branches: [main, dev, stg]
    paths:
      - "indexer/**"
      - "contracts/**"
      - ".github/workflows/indexer-tests.yml"

  pull_request:
    paths:
      - "indexer/**"
      - "contracts/**"
      - ".github/workflows/indexer-tests.yml"

  workflow_dispatch:

concurrency:
  group: indexer-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Indexer Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NETWORK: base-mainnet
      PERPS_ADDRESS: "0x0000000000000000000000000000000000000000"
      PERPS_START_BLOCK: "0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          # Hash both lockfiles — integration tests pull in `derivatives-contracts`
          # (which has its own pnpm-lock.yaml) for the deployment fixture.
          cache-dependency-path: |
            indexer/pnpm-lock.yaml
            contracts/pnpm-lock.yaml

      - name: Install indexer dependencies
        working-directory: ./indexer
        run: pnpm install --frozen-lockfile

      - name: Install contracts dependencies
        working-directory: ./contracts
        run: pnpm install --frozen-lockfile

      # Integration tests deploy the real perps stack via the fixtures in
      # `contracts/tests/fixtures.ts`, which read JSON artifacts from
      # `contracts/artifacts/`. Compile the contracts (and transitive
      # collateral-margin sources) so the fixture can load their bytecode.
      - name: Compile contracts
        working-directory: ./contracts
        run: pnpm compile

      - name: Render subgraph manifest
        working-directory: ./indexer
        run: pnpm prepare:env

      - name: Generate types
        working-directory: ./indexer
        run: pnpm exec graph codegen

      - name: Lint
        working-directory: ./indexer
        run: pnpm lint

      - name: Typecheck
        working-directory: ./indexer
        run: pnpm typecheck

      - name: Run unit tests (matchstick-as)
        working-directory: ./indexer
        run: pnpm test:unit

      - name: Run integration tests (matchstick-ts)
        working-directory: ./indexer
        run: pnpm test:integration
