name: Deploy Perps Keeper ECS Service (deprecated)

# Legacy perps-only keeper — replaced by the unified collateral-margin keeper
# (Lumerin-protocol/collateral-margin, deploy-keeper.yml → svc-col-mar-keeper-*).
# Infrastructure is removed via perpskeeper_service.create=false in bedrock tfvars.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deprecated' to acknowledge this workflow no longer deploys"
        required: true

jobs:
  deprecated:
    name: Deprecated
    runs-on: ubuntu-latest
    steps:
      - name: Block deploy
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deprecated" ]; then
            echo "::error::This workflow is retired. Use collateral-margin deploy-keeper.yml."
            exit 1
          fi
          echo "::warning::Perps keeper ECS is decommissioned. Deploy from collateral-margin instead."
          exit 1
