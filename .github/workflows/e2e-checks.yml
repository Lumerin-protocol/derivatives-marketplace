name: E2E Checks

on:
  push:
    branches: [main, dev, stg]
    paths:
      - "e2e/**"
      - ".github/workflows/e2e-checks.yml"

  pull_request:
    paths:
      - "e2e/**"
      - ".github/workflows/e2e-checks.yml"

  workflow_dispatch:

concurrency:
  group: e2e-checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: E2E Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./e2e

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: e2e/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck
