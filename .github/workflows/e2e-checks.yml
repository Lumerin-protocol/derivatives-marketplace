name: E2E Checks

on:
  push:
    branches: [main, dev, stg]
    paths:
      - "e2e/**"
      - "contracts/**"
      - "indexer/**"
      - ".github/workflows/e2e-checks.yml"

  pull_request:
    paths:
      - "e2e/**"
      - "contracts/**"
      - "indexer/**"
      - ".github/workflows/e2e-checks.yml"

  workflow_dispatch:

concurrency:
  group: e2e-checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ./e2e

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: |
            e2e/pnpm-lock.yaml
            contracts/pnpm-lock.yaml
            indexer/pnpm-lock.yaml

      # e2e typecheck/tests follow imports into `contracts/fixtures/*`, which
      # resolve modules (e.g. viem) from the contracts package. Subgraph deploy
      # runs graph CLI from `indexer/`.
      - name: Install contracts dependencies
        working-directory: ./contracts
        run: pnpm install --frozen-lockfile

      - name: Install indexer dependencies
        working-directory: ./indexer
        run: pnpm install --frozen-lockfile

      - name: Install e2e dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Start Docker stack
        run: pnpm up

      - name: Run e2e tests
        run: pnpm test

      - name: Tear down Docker stack
        if: always()
        run: pnpm down
