# Root entity for contract-wide state and stats
type Perps @entity(immutable: false) {
  "Singleton entity, use id=0"
  id: Int8!

  # Contract addresses
  contractAddress: Bytes!
  collateralToken: Bytes!
  priceOracle: Bytes!

  # Constants
  quantityDecimals: Int!
  minimumPriceIncrement: BigInt!

  # Configuration
  marginPercent: Int!
  maintenanceMarginPercent: Int!
  liquidationFee: BigInt!
  takerFeeBps: Int!
  makerFeeBps: Int!

  # Funding
  fundingRateMaxBps: BigInt!
  fundingPeriod: BigInt!
  cumulativeFundingPerUnit: BigInt!
  lastFundingUpdateTime: BigInt!
  minimumMarginPerOrder: BigInt!

  # Pool balances
  reservePoolBalance: BigInt!
  collectedFeesBalance: BigInt!

  # Stats
  totalUsers: Int!
  totalOrders: Int!
  activeOrders: Int!
  totalTrades: Int!
  totalVolume: BigInt!
  totalLiquidations: Int!
  totalBadDebt: BigInt!

  # Timestamps
  initializedAt: BigInt!
  lastUpdatedAt: BigInt!
}

# User entity with positions and collateral
type User @entity(immutable: false) {
  id: Bytes! # user address
  address: Bytes!

  # Collateral
  collateralBalance: BigInt!
  totalDeposited: BigInt!
  totalWithdrawn: BigInt!

  # Position state (current net position)
  netQuantity: BigInt!
  aggregatedEntryPrice: BigInt!
  "ID of the current open position session (empty when flat). Deterministic: blockNumber + padded logIndex of the open event."
  currentPositionSessionId: String!

  # Funding
  totalFundingPaid: BigInt!
  totalFundingReceived: BigInt!

  # Stats
  orderCount: Int!
  activeOrderCount: Int!
  tradeCount: Int!
  realizedPnl: BigInt!

  # Relations
  orders: [Order!]! @derivedFrom(field: "user")
  trades: [Trade!]! @derivedFrom(field: "user")
  fills: [Fill!]! @derivedFrom(field: "user")
  collateralEvents: [CollateralEvent!]! @derivedFrom(field: "user")
  fundingSettlements: [FundingSettlement!]! @derivedFrom(field: "user")
  badDebts: [BadDebtEvent!]! @derivedFrom(field: "user")
  liquidationsAsUser: [Liquidation!]! @derivedFrom(field: "user")
  liquidationsAsLiquidator: [Liquidation!]! @derivedFrom(field: "liquidator")
  positionSessions: [PositionSession!]! @derivedFrom(field: "user")

  # Timestamps
  createdAt: BigInt!
  lastActivityAt: BigInt!
}

# Order in the order book
type Order @entity(immutable: false) {
  id: Bytes! # orderId
  user: User!
  price: BigInt!
  quantity: BigInt! # current remaining quantity (absolute value)
  originalQuantity: BigInt! # original quantity when created
  isBuy: Boolean! # true = long/buy, false = short/sell
  # Status
  status: OrderStatus!
  filledQuantity: BigInt!

  # Metadata
  createdAt: BigInt!
  updatedAt: BigInt!
  closedAt: BigInt
  blockNumber: BigInt!
  transactionHash: Bytes!
}

enum OrderStatus {
  ACTIVE
  FILLED
  CANCELLED
  PARTIAL
}

# Aggregate of all fills in a single transaction for one user. This is what the UI shows in trade history.
type Trade @entity(immutable: false) {
  id: Bytes! # tx hash + user address
  user: User!
  positionSession: PositionSession!
  tradePrice: BigInt! # volume-weighted average fill price
  tradeQuantity: BigInt! # signed sum of all fill quantities
  tradingFee: BigInt! # sum of all trading fees
  realizedPnl: BigInt! # sum of all fill PnLs
  netQuantityAfter: BigInt! # position after the last fill
  aggregatedEntryPriceAfter: BigInt! # entry price after the last fill
  fillCount: Int!
  fills: [Fill!]! @derivedFrom(field: "trade")
  # Metadata
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# One per user per OrderMatched event. Individual execution against a counterparty.
type Fill @entity(immutable: true) {
  id: Bytes! # tx hash + log index + side suffix
  trade: Trade!
  user: User!
  counterparty: User!
  makerOrderId: Bytes!
  positionSession: PositionSession!
  fillPrice: BigInt!
  fillQuantity: BigInt! # signed: positive = bought/long, negative = sold/short
  netQuantityAfter: BigInt! # signed position after this fill (computed by indexer)
  aggregatedEntryPriceAfter: BigInt! # computed by indexer
  realizedPnl: BigInt! # computed by indexer; non-zero when this fill closed (full or partial) size
  tradingFee: BigInt! # signed: positive = paid, negative = rebate
  # Metadata
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# Liquidation event
type Liquidation @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  user: User!
  liquidator: User!
  positionSize: BigInt! # signed
  pnl: BigInt! # signed
  liquidatorFee: BigInt!

  # Metadata
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# Collateral event (deposit or withdrawal)
type CollateralEvent @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  user: User!
  amount: BigInt!
  isDeposit: Boolean!

  # Metadata
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# Order book price level aggregation
type PriceLevel @entity(immutable: false) {
  "ID format: {price}-{side} where side is 'bid' or 'ask'"
  id: String!
  price: BigInt!
  isBid: Boolean!
  totalQuantity: BigInt!
  orderCount: Int!
}

# Funding rate update event (global)
type FundingUpdate @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  fundingRate: BigInt! # signed
  cumulativeFundingPerUnit: BigInt! # signed
  # Metadata
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# Funding settlement for a user
type FundingSettlement @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  user: User!
  positionSession: PositionSession
  amount: BigInt! # signed: positive = received, negative = paid
  # Metadata
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# Bad debt event when a user can't cover losses
type BadDebtEvent @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  user: User!
  amount: BigInt!
  # Metadata
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type ReservePoolEvent @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  type: ReservePoolEventType!
  amount: BigInt!
  user: User!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

enum ReservePoolEventType {
  RESERVE
  FEE
}

# One per open→close cycle. ID = blockNumber (padded) + logIndex (padded) of the open event.
type PositionSession @entity(immutable: false) {
  id: String! # blockNumber (12 digits) + logIndex (6 digits), deterministic
  status: PositionSessionStatus!
  user: User!
  entryPrice: BigInt! # average entry price of the position
  closePrice: BigInt! # average exit price (updated as we close)
  maxQuantity: BigInt! # maximum absolute quantity reached (non-cumulative)
  closedQuantity: BigInt! # cumulative quantity closed
  realizedPnl: BigInt!
  fundingFees: BigInt! # signed: positive = received, negative = paid
  tradingFees: BigInt! # signed: positive = paid, negative = rebate received
  openedAt: BigInt!
  lastTradeAt: BigInt!
  fills: [Fill!]! @derivedFrom(field: "positionSession")
  trades: [Trade!]! @derivedFrom(field: "positionSession")
  fundingSettlements: [FundingSettlement!]! @derivedFrom(field: "positionSession")
}

enum PositionSessionStatus {
  OPEN
  CLOSE
}
