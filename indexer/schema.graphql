# Root entity for contract-wide state and stats
type Perps @entity(immutable: false) {
  "Singleton entity, use id=0"
  id: Int8!

  # Contract addresses
  contractAddress: Bytes!
  "Vault holding user collateral; the ERC-20 itself is read off the vault."
  collateralVault: Bytes!
  priceOracle: Bytes!
  portfolioMarginEngine: Bytes!

  # Constants
  quantityDecimals: Int!
  minimumPriceIncrement: BigInt!

  # Configuration
  liquidationFeeBps: Int!
  liquidatorShareBps: Int!
  takerFeeBps: Int!
  makerFeeBps: Int!

  # Funding
  fundingRateMaxBps: BigInt!
  fundingPeriod: BigInt!
  cumulativeFundingPerUnit: BigInt!
  lastFundingUpdateTime: BigInt!
  minimumMarginPerOrder: BigInt!

  # Pool balances
  reservePoolBalance: BigInt!
  collectedFeesBalance: BigInt!

  # Stats
  totalUsers: Int!
  "Orders ever created; one per on-chain orderId."
  totalOrders: Int!
  "Orders currently resting in the book (status ACTIVE or PARTIALLY_FILLED)."
  activeOrders: Int!
  "Trade rows ever created. One per (tx, user, position session), so a two-sided match bumps it by 2 and a flip by 3."
  totalTrades: Int!
  "Fill rows ever created. One per (OrderMatched, side); forced closes have no matched counterparty order and so no Fill."
  totalFills: Int!
  totalVolume: BigInt!
  totalLiquidations: Int!
  totalBadDebt: BigInt!

  # Timestamps
  initializedAt: BigInt!
  lastUpdatedAt: BigInt!
}

# User entity with positions and collateral
type User @entity(immutable: false) {
  id: Bytes! # user address
  address: Bytes!

  # Position state (current net position)
  netQuantity: BigInt!
  aggregatedEntryPrice: BigInt!
  "ID of the current open position session (empty when flat). Deterministic: blockNumber + padded logIndex of the open event."
  currentPositionSessionId: String!

  # Funding
  totalFundingPaid: BigInt!
  totalFundingReceived: BigInt!

  # Stats
  orderCount: Int!
  "Orders currently resting in the book (status ACTIVE or PARTIALLY_FILLED)."
  activeOrderCount: Int!
  "Trade rows: one per (tx, position session)."
  tradeCount: Int!
  "Fill rows: one per matched leg."
  fillCount: Int!
  realizedPnl: BigInt!

  "Transient: orderId of the user's most recent OrderCreated event. Used by the indexer to attribute taker-side fills (since OrderMatched only carries makerOrderId). Not intended for client queries."
  lastCreatedOrderId: Bytes!

  # Relations
  orders: [Order!]! @derivedFrom(field: "user")
  trades: [Trade!]! @derivedFrom(field: "user")
  fills: [Fill!]! @derivedFrom(field: "user")
  fundingSettlements: [FundingSettlement!]! @derivedFrom(field: "user")
  badDebts: [BadDebtEvent!]! @derivedFrom(field: "user")
  positionSessions: [PositionSession!]! @derivedFrom(field: "user")

  # Timestamps
  createdAt: BigInt!
  lastActivityAt: BigInt!
}

# Order in the order book
type Order @entity(immutable: false) {
  id: Bytes! # orderId
  user: User!
  price: BigInt!
  "Remaining open quantity (absolute value); zero once terminal."
  quantity: BigInt!
  originalQuantity: BigInt! # original quantity when created
  isBuy: Boolean! # true = long/buy, false = short/sell
  # Status
  status: OrderStatus!
  filledQuantity: BigInt!
  "Volume-weighted average price across all fills against this order. Zero if no fills."
  averageFillPrice: BigInt!
  "Keeper that force-cancelled this order; populated only when status = LIQUIDATED (from the paired OrderLiquidated event)."
  liquidator: Bytes
  "Fee paid by the order's participant to `liquidator`; populated only when status = LIQUIDATED."
  liquidationFee: BigInt

  # Relations
  fills: [Fill!]! @derivedFrom(field: "order")

  # Metadata
  createdAt: BigInt!
  updatedAt: BigInt!
  closedAt: BigInt
  blockNumber: BigInt!
  transactionHash: Bytes!
}

enum OrderStatus {
  "Resting with no fills yet."
  ACTIVE
  "Resting with at least one fill; still has remaining quantity."
  PARTIALLY_FILLED
  "Terminal: left the book fully matched."
  FILLED
  "Terminal: left the book unmatched (cancel or an IOC close)."
  CANCELLED
  "Terminal: force-cancelled by a keeper via liquidateOrder."
  LIQUIDATED
}

# Aggregate of all fills in a single transaction for one user and position
# session. This is what the UI shows in trade history.
type Trade @entity(immutable: false) {
  id: Bytes! # tx hash + user address + position session id
  user: User!
  positionSession: PositionSession!
  tradePrice: BigInt! # volume-weighted average fill price
  tradeQuantity: BigInt! # signed sum of all fill quantities
  tradingFee: BigInt! # sum of all trading fees
  realizedPnl: BigInt! # sum of all fill PnLs
  netQuantityAfter: BigInt! # position after the last fill
  aggregatedEntryPriceAfter: BigInt! # entry price after the last fill
  fillCount: Int!
  "True when this Trade was a forced liquidation against the market."
  isLiquidation: Boolean! # default false
  "Keeper that triggered the liquidation; set only when isLiquidation."
  liquidator: Bytes # nullable
  "Fee paid to the liquidator; set only when isLiquidation."
  liquidationFee: BigInt # nullable
  fills: [Fill!]! @derivedFrom(field: "trade")
  # Metadata
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# One per user per OrderMatched leg. Individual execution against a
# counterparty. A forced close has no matched counterparty order, so it produces
# a Trade but no Fill.
type Fill @entity(immutable: true) {
  id: Bytes! # tx hash + log index + leg suffix
  trade: Trade!
  "Whether `user` was the maker (resting order) or the taker (incoming order) in this match."
  side: FillSide!
  user: User!
  counterparty: User!
  "The user's own order in this match (taker order when `side` is TAKER, maker order when `side` is MAKER)."
  order: Order!
  "The counterparty's order in this match. The resting/maker order when `side` is TAKER; the incoming/taker order when `side` is MAKER."
  counterpartyOrder: Order!
  positionSession: PositionSession!
  fillPrice: BigInt!
  fillQuantity: BigInt! # signed: positive = bought/long, negative = sold/short
  netQuantityAfter: BigInt! # signed position after this fill (computed by indexer)
  aggregatedEntryPriceAfter: BigInt! # computed by indexer
  realizedPnl: BigInt! # computed by indexer; non-zero when this fill closed (full or partial) size
  tradingFee: BigInt! # signed: positive = paid, negative = rebate
  # Metadata
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

enum FillSide {
  MAKER
  TAKER
}

# Order book price level aggregation
type PriceLevel @entity(immutable: false) {
  "ID format: {price}-{side} where side is 'bid' or 'ask'"
  id: String!
  price: BigInt!
  isBid: Boolean!
  totalQuantity: BigInt!
  orderCount: Int!
}

# Funding rate update event (global)
type FundingUpdate @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  fundingRate: BigInt! # signed
  cumulativeFundingPerUnit: BigInt! # signed
  # Metadata
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# Funding settlement for a user
type FundingSettlement @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  user: User!
  positionSession: PositionSession
  amount: BigInt! # signed: positive = received, negative = paid
  # Metadata
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# Bad debt event when a user can't cover losses
type BadDebtEvent @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  user: User!
  amount: BigInt!
  # Metadata
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type ReservePoolEvent @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  type: ReservePoolEventType!
  amount: BigInt!
  user: User!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

enum ReservePoolEventType {
  RESERVE
  FEE
}

# One per open→close cycle. ID = blockNumber (padded) + logIndex (padded) of the open event.
type PositionSession @entity(immutable: false) {
  id: String! # blockNumber (12 digits) + logIndex (6 digits), deterministic
  status: PositionSessionStatus!
  user: User!
  entryPrice: BigInt! # average entry price of the position
  closePrice: BigInt! # average exit price (updated as we close)
  maxQuantity: BigInt! # maximum absolute quantity reached (non-cumulative)
  closedQuantity: BigInt! # cumulative quantity closed
  "Cumulative absolute quantity closed via liquidation in this session (default 0). 'Was liquidated' = liquidatedQuantity > 0."
  liquidatedQuantity: BigInt! # default 0
  realizedPnl: BigInt!
  fundingFees: BigInt! # signed: positive = received, negative = paid
  tradingFees: BigInt! # signed: positive = paid, negative = rebate received
  openedAt: BigInt!
  lastTradeAt: BigInt!
  fills: [Fill!]! @derivedFrom(field: "positionSession")
  trades: [Trade!]! @derivedFrom(field: "positionSession")
  fundingSettlements: [FundingSettlement!]! @derivedFrom(field: "positionSession")
}

enum PositionSessionStatus {
  OPEN
  CLOSE
}
