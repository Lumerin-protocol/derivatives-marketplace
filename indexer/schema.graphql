# Root entity for contract-wide state and stats
type Perps @entity(immutable: false) {
  "Singleton entity, use id=0"
  id: Int8!

  # Contract addresses
  contractAddress: Bytes!
  collateralToken: Bytes!
  priceOracle: Bytes!

  # Configuration
  marginPercent: Int!
  maintenanceMarginPercent: Int!
  liquidationFee: BigInt!
  minimumPriceIncrement: BigInt!
  orderFee: BigInt!

  # Pool balances
  reservePoolBalance: BigInt!
  collectedFeesBalance: BigInt!

  # Stats
  totalUsers: Int!
  totalOrders: Int!
  activeOrders: Int!
  totalTrades: Int!
  totalVolume: BigInt!
  totalLiquidations: Int!

  # Timestamps
  initializedAt: BigInt!
  lastUpdatedAt: BigInt!
}

# User entity with positions and collateral
type User @entity(immutable: false) {
  id: Bytes! # user address
  address: Bytes!

  # Collateral
  collateralBalance: BigInt!
  totalDeposited: BigInt!
  totalWithdrawn: BigInt!

  # Position state (current net position)
  netQuantity: BigInt!
  aggregatedEntryPrice: BigInt!

  # Stats
  orderCount: Int!
  activeOrderCount: Int!
  tradeCount: Int!
  realizedPnl: BigInt!

  # Relations
  orders: [Order!]! @derivedFrom(field: "user")
  trades: [Trade!]!
  positionHistory: [PositionSnapshot!]! @derivedFrom(field: "user")
  positionCloses: [PositionClose!]! @derivedFrom(field: "user")
  collateralEvents: [CollateralEvent!]! @derivedFrom(field: "user")
  liquidationsAsUser: [Liquidation!]! @derivedFrom(field: "user")
  liquidationsAsLiquidator: [Liquidation!]! @derivedFrom(field: "liquidator")

  # Timestamps
  createdAt: BigInt!
  lastActivityAt: BigInt!
}

# Order in the order book
type Order @entity(immutable: false) {
  id: Bytes! # orderId
  user: User!
  price: BigInt!
  quantity: BigInt! # current remaining quantity (absolute value)
  originalQuantity: BigInt! # original quantity when created
  isBuy: Boolean! # true = long/buy, false = short/sell
  # Status
  status: OrderStatus!
  filledQuantity: BigInt!

  # Metadata
  createdAt: BigInt!
  updatedAt: BigInt!
  closedAt: BigInt
  blockNumber: BigInt!
  transactionHash: Bytes!
}

enum OrderStatus {
  ACTIVE
  FILLED
  CANCELLED
  PARTIAL
}

# Trade (matched order)
type Trade @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  makerOrderId: Bytes!
  buyer: User!
  seller: User!
  price: BigInt!
  quantity: BigInt!
  volume: BigInt! # price * quantity
  # Metadata
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# Position snapshot after each trade (from PositionTrade event)
type PositionSnapshot @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  user: User!
  tradePrice: BigInt!
  tradeQuantity: BigInt! # signed: positive = bought, negative = sold
  netQuantityAfter: BigInt! # signed: positive = long, negative = short
  aggregatedEntryPriceAfter: BigInt!

  # Metadata
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# Position close event (full or partial)
type PositionClose @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  user: User!
  quantityClosed: BigInt! # signed
  pnl: BigInt! # signed: positive = profit, negative = loss
  # Metadata
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# Liquidation event
type Liquidation @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  user: User!
  liquidator: User!
  positionSize: BigInt! # signed
  pnl: BigInt! # signed
  liquidatorFee: BigInt!

  # Metadata
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# Collateral event (deposit or withdrawal)
type CollateralEvent @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  user: User!
  amount: BigInt!
  isDeposit: Boolean!

  # Metadata
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# Order book price level aggregation
type PriceLevel @entity(immutable: false) {
  "ID format: {price}-{side} where side is 'bid' or 'ask'"
  id: String!
  price: BigInt!
  isBid: Boolean!
  totalQuantity: BigInt!
  orderCount: Int!
}
