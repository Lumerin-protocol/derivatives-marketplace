# Use subgraph.template.yaml to add changes to the subgraph.yaml file
# Variables are substituted via envsubst from environment variables
specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: HashPowerPerpsDEX
    network: "${NETWORK}"
    source:
      address: "${PERPS_ADDRESS}"
      startBlock: ${PERPS_START_BLOCK}
      abi: HashPowerPerpsDEX
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Perps
        - User
        - Order
        - Trade
        - PositionSnapshot
        - PositionClose
        - Liquidation
        - CollateralEvent
        - PriceLevel
        - FundingUpdate
        - FundingSettlement
        - BadDebtEvent
      abis:
        - name: HashPowerPerpsDEX
          file: ../contracts/abi/HashPowerPerpsDEX.json
      eventHandlers:
        # Order events
        - event: OrderCreated(indexed bytes32,indexed address,uint256,int256)
          handler: handleOrderCreated
        - event: OrderCancelled(indexed bytes32,indexed address)
          handler: handleOrderCancelled
        - event: OrderUpdated(indexed bytes32,indexed address,int256)
          handler: handleOrderUpdated
        - event: OrderMatched(indexed bytes32,indexed address,indexed address,uint256,int256,int256,int256,int256,int256,uint256,uint256)
          handler: handleOrderMatched
        - event: PositionLiquidated(indexed address,indexed address,int256,int256,uint256)
          handler: handlePositionLiquidated
        # Collateral events
        - event: CollateralAdded(indexed address,uint256)
          handler: handleCollateralAdded
        - event: CollateralRemoved(indexed address,uint256)
          handler: handleCollateralRemoved
        # Funding events
        - event: FundingUpdated(int256,int256,uint256)
          handler: handleFundingUpdated
        - event: FundingSettled(indexed address,int256)
          handler: handleFundingSettled
        - event: BadDebt(indexed address,uint256)
          handler: handleBadDebt
        # Config events
        - event: MatchFeeUpdated(int16,int16)
          handler: handleMatchFeeUpdated
        - event: MarginPercentUpdated(uint8)
          handler: handleMarginPercentUpdated
        - event: MaintenanceMarginPercentUpdated(uint8)
          handler: handleMaintenanceMarginPercentUpdated
        - event: LiquidationFeeUpdated(uint256)
          handler: handleLiquidationFeeUpdated
        - event: FundingParametersUpdated(uint256,uint256)
          handler: handleFundingParametersUpdated
        - event: MinimumMarginPerOrderUpdated(uint256)
          handler: handleMinimumMarginPerOrderUpdated
        # Upgradeable events
        - event: Initialized(uint64)
          handler: handleInitialized
      file: ./src/perps.ts
# Required when deploying with `goldsky subgraph deploy ... --graft-from <name>/<version>`
features:
  - grafting
